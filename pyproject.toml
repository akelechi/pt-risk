[project]
name = "roseton-ledger"
version = "0.0.0"
description = "Per-plant commercial model of Roseton (NYISO Zone G): state machine + ledger."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=16",
    "pyyaml>=6",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # pandas 2.3 internals on numpy >= 2.4 (timedelta arithmetic); not our code
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
